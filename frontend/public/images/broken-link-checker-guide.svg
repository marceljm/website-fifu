<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1536" height="960" viewBox="0 0 1536 960" role="img" aria-labelledby="title description"><title id="title">Broken Link Checker workflow</title><desc id="description">Four steps: enable checking, pages are visited, one queued URL is checked at a time with 24-hour retries, and three failures cause an image URL to be listed as broken.</desc>
